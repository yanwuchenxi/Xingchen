name: Build Mobile APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mobileRelease
        run: |
          python3 --version
          ./gradlew assembleMobileArm64_v8aRelease --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx5g -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx5g"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xingchen-mobile-release
          path: |
            app/build/outputs/apk/**/*.apk
            Release/apk/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: List outputs
        if: always()
        run: |
          find app/build/outputs -name "*.apk" -ls 2>/dev/null || echo "No APK under app/build/outputs"
          find Release -name "*.apk" -ls 2>/dev/null || true
